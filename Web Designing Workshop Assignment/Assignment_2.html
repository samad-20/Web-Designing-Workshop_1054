<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 2: Headings, Paragraphs, Formatting and Special Characters</title>
</head>
<body>

    <!-- Headings -->
    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>
     <!-- Paragraph with Text Formatting -->
    <p>
        Text with
        <b>bold</b>,       <!-- bold text -->
        <i>italic</i>,     <!-- italic text -->
        <u>underline</u>, <!-- underline text -->
        <mark>mark</mark>, <!-- marked text -->
        H<sub>2</sub>O,    <!-- subscript text -->
        x<sup>2</sup>      <!-- superscript text -->
    </p>
    <!-- Paragraph with HTML Character Entities -->
    <p>
        &copy;       <!-- copyright symbol (©) -->
        &reg;        <!-- registered trademark symbol (®) -->
        &trade;      <!-- trademark symbol (™) -->
        &lt;tag&gt;   <!-- less-than and greater-than signs (< >) -->
        &amp;        <!-- ampersand or insert "and symbol" (&) -->
        &euro;       <!-- euro symbol (€) -->
        &#8377;      <!-- Indian Rupee symbol (₹) -->
        &hearts;     <!-- heart symbol (♥) -->
    </p>
     <!-- Horizontal Rule -->
    <hr>

    <!-- Paragraph with Line Break -->
    <p>
        Line one<br> <!-- <br> forces a line break here -->
        Line two
    </p>

</body>
</html>
