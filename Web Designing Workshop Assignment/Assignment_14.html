<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 14: Nested and Responsive Tables</title>
     <style>
    /* Responsive wrapper: wide table scrolls sideways on small screens */
    .table-wrap {
      overflow-x: auto;
      max-width: 100%;
    }
    table {
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #555;
      padding: 10px 14px;
      text-align: center;
    }
    /* Nested table: left-aligned text */
    table table th,
    table table td {
      text-align: left;
    }
  </style>
</head>

</html>
