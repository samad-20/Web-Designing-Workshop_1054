<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC College Admission 2026</title>
</head>
<body>
     <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header, footer {
      background-color: #1a237e;
      color: #fff;
      text-align: center;
    }
    header { padding: 22px 16px; }
    header h1 { margin: 0; font-size: 2em; }
    footer { padding: 12px 16px; margin-top: auto; }

    main {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 0 8px 20px;
      flex: 1;
    }

    /* Table */
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    caption { padding: 4px 0; }
    th, td {
      border: 1px solid #999;
      padding: 6px 7px;
      text-align: left;
    }
    th {
      background-color: #e8eaf6;
      text-align: center;
    }

    /* Form */
    fieldset { margin-top: 20px; padding: 4px 14px 12px; }
    .field { margin: 0 0 14px; }
    label { display: block; }
    input[type="text"],
    input[type="email"] { width: 260px; max-width: 100%; }
    textarea { width: 100%; max-width: 460px; }
    button { padding: 4px 8px; font-size: 1em; }

    /* Visible keyboard focus for accessibility */
    a:focus, input:focus, select:focus, textarea:focus, button:focus {
      outline: 3px solid #ff9800;
      outline-offset: 2px;
    }

    /* Skip link: hidden until focused */
    .skip-link {
      position: absolute;
      left: -999px;
    }
    .skip-link:focus {
      left: 8px;
      top: 8px;
      background: #fff;
      padding: 6px 10px;
      z-index: 10;
    }
  </style
  </head>
<body>

  <a class="skip-link" href="#main">Skip to main content</a>

  <header>
    <h1>ABC College Admission 2026</h1>
  </header>

  <main id="main">

    <section aria-labelledby="courses-heading">
      <h2 id="courses-heading">Courses and Fees</h2>

      <div class="table-wrap">
        <table>
          <caption>Available Courses</caption>
          <thead>
            <tr>
              <th scope="col">Course</th>
              <th scope="col">Seats</th>
              <th scope="col">Fees</th>
            </tr>
          </thead>
          <tbody>
</body>
</html>
