<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Room Booking Form</title>
</head>
<body>

    <h1 align="center">Hotel Room Booking Form</h1>

    <form action="#" method="post" align="center">
        <!-- Name -->
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" required>
        <br><br>

        <!-- Email -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <!-- Phone -->
        <label for="phone">Phone:</label>
        <input type="phone" id="phone" name="phone" required>
        <br><br>
         <!-- Check-in Date -->
        <label for="checkin">Check-in Date:</label>
        <input type="date" id="checkin" name="checkin" required>
        <br><br>

        <!-- Check-out Date -->
        <label for="checkout">Check-out Date:</label>
        <input type="date" id="checkout" name="checkout" required>
        <br><br>

        <!-- Room Type -->
        <label for="roomtype">Room Type:</label>
        <select id="roomtype" name="roomtype" required>
            <option value="">Select a room type</option>
            <option value="single non-ac">Single Bed (Non-AC)</option>
            <option value="double non-ac">Double Bed (Non-AC)</option>
            <option value="single ac">Single Bed (AC)</option>
            <option value="double ac">Double Bed (AC)</option>
            <option value="suite">Suite</option>
        </select>
        <br><br>

        <!-- Number of Guests -->
        <label for="guests">Number of Guests:</label>
        <input type="number" id="guests" name="guests"
               min="1" max="4" required>
        <br><br>
        <!-- Special Requests -->
        <label for="requests">Special Requests:</label>
        <br>
        <textarea id="requests" name="requests"
                  rows="4" cols="50"></textarea>
        <br><br>

        <!-- Book Button -->
        <input type="submit" value="Book Now">

        <!-- Reset Button -->
        <input type="reset" value="Reset Form">

    </form>

</body>
</html>
